appId: ai.sapiens.vibeflow
productName: VibeFlow
copyright: VibeFlow (fork of Flowise, Apache-2.0)

directories:
    output: dist
    buildResources: build

# The desktop packages ship a self-contained copy of the server (production dependencies from
# `pnpm deploy` plus the prebuilt UI), so the installed application needs no repository.
# Produce it first with:
#   pnpm --filter "./packages/server" deploy --prod --legacy .agnes/work/portable/server
#   (then copy packages/ui/build into .agnes/work/portable/server/node_modules/flowise-ui/build)
files:
    - main.js
    - package.json
extraResources:
    - from: ../../.agnes/work/portable/server
      to: server

win:
    target:
        - target: nsis
          arch:
              - x64
    artifactName: VibeFlow-Setup-${version}-${arch}.${ext}
    # Skipping the executable signing/editing step avoids requiring the winCodeSign tools, whose
    # extraction needs symbolic-link privileges on Windows (Developer Mode or administrator).
    # The produced installer therefore keeps the default Electron icon and metadata.
    signAndEditExecutable: false

nsis:
    oneClick: false
    perMachine: false
    allowToChangeInstallationDirectory: true
    createDesktopShortcut: true
    createStartMenuShortcut: true
    shortcutName: VibeFlow

linux:
    target:
        - target: AppImage
          arch:
              - x64
        - target: deb
          arch:
              - x64
    category: Development
    maintainer: VibeFlow
    artifactName: VibeFlow-${version}-${arch}.${ext}

mac:
    target:
        - target: dmg
          arch:
              - x64
              - arm64
    category: public.app-category.developer-tools
    artifactName: VibeFlow-${version}-${arch}.${ext}
