appId: ai.sapiens.vibeflow
productName: VibeFlow
copyright: VibeFlow (fork of Flowise, Apache-2.0)

directories:
    output: dist
    buildResources: build

# The desktop shell starts the Flowise-compatible server from the repository, so the repository
# itself (or the extracted application directory) is shipped as extra resources.
files:
    - main.js
    - package.json
extraResources:
    - from: ../../packages/server
      to: server
      filter:
          - '**/*'
          - '!**/*.map'
          - '!**/node_modules/**'

win:
    target:
        - target: nsis
          arch:
              - x64
    artifactName: VibeFlow-Setup-${version}-${arch}.${ext}

nsis:
    oneClick: false
    perMachine: false
    allowToChangeInstallationDirectory: true
    createDesktopShortcut: true
    createStartMenuShortcut: true
    shortcutName: VibeFlow

linux:
    target:
        - target: AppImage
          arch:
              - x64
        - target: deb
          arch:
              - x64
    category: Development
    maintainer: VibeFlow
    artifactName: VibeFlow-${version}-${arch}.${ext}

mac:
    target:
        - target: dmg
          arch:
              - x64
              - arm64
    category: public.app-category.developer-tools
    artifactName: VibeFlow-${version}-${arch}.${ext}
